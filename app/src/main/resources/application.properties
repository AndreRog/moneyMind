quarkus.http.port=9000
quarkus.http.host=0.0.0.0
# Datasource configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=admin
quarkus.datasource.password=admin
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/money_mind
quarkus.jooq.dialect=PostgreSQL
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173

quarkus.log.level=INFO
# Keep DEBUG only for our application code
quarkus.log.category."com.moneymind".level=DEBUG
quarkus.log.category."com.github.fommil.netlib".level=ERROR

# Run Flyway migrations automatically
quarkus.flyway.migrate-at-start=true

# Guard against oversized guest uploads
quarkus.http.limits.max-body-size=10M

# CORS SETUP FOR FRONT END DEV
#quarkus.http.cors=true
#quarkus.http.cors.origins=http://REPLACEME:REPLACEME
quarkus.http.cors.headers=Content-Type, Authorization
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
# In src/main/resources/application.properties
quarkus.debug.port=5006
